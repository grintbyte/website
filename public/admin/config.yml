# Decap CMS configuration for GrintByte.
#
# PLACEHOLDERS TO REPLACE before production use (see README "CMS setup"):
#   - repo:      your GitHub <owner>/<repo>
#   - base_url:  your OAuth proxy URL (e.g. a Cloudflare Worker). GitHub Pages
#                has no server, so the GitHub OAuth handshake needs an external
#                proxy. Alternative: Sveltia CMS needs no proxy at all.
backend:
  name: github
  repo: grintbyte/website
  branch: main
  base_url: https://YOUR-OAUTH-PROXY.workers.dev # <-- replace (not needed for Sveltia)

# Editorial workflow: changes land as pull requests with a review step.
# Delete (or comment) the next line to publish straight to the branch.
publish_mode: editorial_workflow

# Local editing: run `npx decap-server` in one terminal and `npm run dev` in
# another, then open http://localhost:4321/admin/ - no login needed.
local_backend: true

media_folder: public/images/uploads
# public_folder is the path written into content. It is deliberately relative
# to the site root; the templates wrap every image path in withBase(), so it
# keeps working when the site is served under a /repo base path.
public_folder: /images/uploads

collections:
  - name: products
    label: Products
    folder: src/content/products
    create: true
    slug: "{{slug}}"
    summary: "{{title}} ({{category}})"
    fields:
      - { name: title, label: Title, widget: string }
      - name: category
        label: Category
        widget: select
        options:
          - WordPress Plugins
          - Shopify Apps
          - AI Tools
          - Odoo Apps
          - Dolibarr Modules
          - Chrome Extensions
          - Software Platforms
      - { name: short_description, label: Short description, widget: text }
      - { name: icon, label: Icon / thumbnail, widget: image, required: false }
      - name: screenshots
        label: Screenshots
        widget: list
        required: false
        field: { name: image, label: Image, widget: image }
      - name: pricing_type
        label: Pricing type
        widget: select
        options: [Free, Freemium, Paid]
      - { name: price, label: Price (display text), widget: string, required: false, hint: 'e.g. "$29/yr" or "from $15/mo"' }
      - name: features
        label: Features
        widget: list
        required: false
        field: { name: feature, label: Feature, widget: string }
      - { name: version, label: Version, widget: string, required: false }
      - { name: compatibility, label: Compatibility, widget: string, required: false, hint: 'e.g. "WordPress 6.x" or "Odoo 17"' }
      - name: links
        label: Links
        widget: object
        required: false
        fields:
          - { name: store_url, label: Store URL, widget: string, required: false }
          - { name: demo_url, label: Demo URL, widget: string, required: false }
          - { name: docs_url, label: Docs URL, widget: string, required: false }
          - { name: buy_url, label: Buy URL, widget: string, required: false }
      - { name: featured, label: Featured on home page, widget: boolean, default: false }
      - name: status
        label: Status
        widget: select
        options: [Available, "Coming Soon"]
        default: Available
      - { name: body, label: Description, widget: markdown }

  - name: solutions
    label: Solutions
    folder: src/content/solutions
    create: true
    slug: "{{slug}}"
    fields:
      - { name: title, label: Title, widget: string }
      - { name: icon, label: Icon name, widget: string, required: false, hint: "One of: plug, bag, nodes, boxes, layers, window, stack, code, blueprint, cart" }
      - { name: order, label: Display order, widget: number, default: 99 }
      - { name: short_description, label: Short description, widget: text }
      - name: benefits
        label: Benefits
        widget: list
        required: false
        field: { name: benefit, label: Benefit, widget: string }
      - name: process_steps
        label: Process steps
        widget: list
        required: false
        fields:
          - { name: title, label: Step title, widget: string }
          - { name: description, label: Step description, widget: text }
      - { name: cta_text, label: CTA text, widget: string, default: "Talk to us about this" }
      - { name: body, label: Long description, widget: markdown, required: false }

  - name: testimonials
    label: Testimonials
    folder: src/content/testimonials
    create: true
    slug: "{{slug}}"
    summary: "{{name}} - {{company}}"
    fields:
      - { name: name, label: Name, widget: string }
      - { name: company, label: Company, widget: string }
      - { name: quote, label: Quote, widget: text }
      - { name: avatar, label: Avatar, widget: image, required: false }
      - { name: rating, label: Rating (1-5), widget: number, default: 5, min: 1, max: 5 }

  - name: pages
    label: Pages
    files:
      - name: home
        label: Home
        file: src/content/pages/home.json
        fields:
          - { name: hero_title, label: Hero title, widget: string }
          - { name: hero_subtitle, label: Hero subtitle, widget: text }
          - name: hero_primary_cta
            label: Primary CTA
            widget: object
            fields:
              - { name: text, label: Text, widget: string }
              - { name: url, label: URL, widget: string }
          - name: hero_secondary_cta
            label: Secondary CTA
            widget: object
            fields:
              - { name: text, label: Text, widget: string }
              - { name: url, label: URL, widget: string }
          - name: stats
            label: Statistics
            widget: list
            required: false
            hint: "Only enter numbers you can back with a real source."
            fields:
              - { name: value, label: Value, widget: string }
              - { name: label, label: Label, widget: string }
          - { name: show_stats, label: Show statistics section, widget: boolean, default: false }
          - { name: show_testimonials, label: Show testimonials section, widget: boolean, default: false, hint: "Turn on only after replacing the sample testimonials with real ones." }
          - { name: show_featured, label: Show featured products, widget: boolean, default: true }
          - { name: show_solutions, label: Show solutions section, widget: boolean, default: true }
      - name: about
        label: About
        file: src/content/pages/about.json
        fields:
          - { name: intro, label: Intro, widget: text }
          - { name: story, label: Story, widget: text }
          - { name: mission, label: Mission, widget: text }
          - name: values
            label: Values
            widget: list
            fields:
              - { name: title, label: Title, widget: string }
              - { name: description, label: Description, widget: text }
          - name: team
            label: Team (optional)
            widget: list
            required: false
            fields:
              - { name: name, label: Name, widget: string }
              - { name: role, label: Role, widget: string }
              - { name: photo, label: Photo, widget: image, required: false }
      - name: contact
        label: Contact
        file: src/content/pages/contact.json
        fields:
          - { name: email, label: Email, widget: string }
          - { name: enquiry_email, label: "Solution enquiry email (destination)", widget: string, required: false }
          - { name: whatsapp, label: "WhatsApp (international format, e.g. +62812...)", widget: string, required: false }
          - { name: address, label: Address, widget: text, required: false }
          - { name: working_hours, label: Working hours, widget: string, required: false }
          - { name: form_action_url, label: "Form endpoint URL (Web3Forms/Formspree)", widget: string, required: false, hint: "Leave empty to hide the form and show the email fallback." }
          - name: emailjs
            label: "EmailJS (enquiry form with auto-response)"
            widget: object
            required: false
            fields:
              - { name: public_key, label: Public key, widget: string, required: false }
              - { name: service_id, label: Service ID, widget: string, required: false }
              - { name: template_notify, label: "Template ID: notification to the team", widget: string, required: false }
              - { name: template_autoreply, label: "Template ID: auto-reply to the client", widget: string, required: false }

  - name: settings
    label: Site settings
    files:
      - name: site
        label: General
        file: src/content/settings/site.json
        fields:
          - { name: site_title, label: Site title, widget: string }
          - { name: tagline, label: Tagline, widget: string }
          - { name: logo, label: Logo, widget: image }
          - name: social_links
            label: Social links
            widget: list
            required: false
            fields:
              - { name: label, label: Label, widget: string }
              - { name: url, label: URL, widget: string }
          - { name: footer_text, label: Footer text, widget: text }
          - name: seo
            label: SEO defaults
            widget: object
            fields:
              - { name: meta_description, label: Default meta description, widget: text }
              - { name: og_image, label: Default OG image, widget: image }
